services:
  app:
    # LOG-3: to the journal; VictoriaLogs shows it as source:<compose project>.
    logging:
      driver: journald
      options:
        tag: "{{.Name}}"
        labels: com.docker.compose.project
    build: .
    env_file: .env
    networks: [traefik_default]
    restart: unless-stopped
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.rule=Host(`${SERVICE_HOST}`)"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.tls.certresolver=le"
      # Public, with no Authelia: the fleet's public middlewares (reverse-proxy
      # decisions/015, NET-4). public-guard caps requests in flight per Host
      # against crawler swarms; public-compress gzips text. There is no
      # /healthz yet (Birdhouse#7), so no health router outside the cap.
      - "traefik.http.routers.${COMPOSE_PROJECT_NAME}.middlewares=public-guard@file,public-compress@file"
      - "traefik.http.services.${COMPOSE_PROJECT_NAME}.loadbalancer.server.port=${PORT:-8090}"
      - "homepage.group=Birds"
      - "homepage.name=Birdhouse"
      - "homepage.icon=mdi-bird"
      - "homepage.href=https://${SERVICE_HOST}"
      - "homepage.description=Today's bird detections"
      - "homepage.instance=my-docker"
    volumes:
      # BirdNET-Go SQLite database (read-only).
      # BIRDNET_DB_HOST_PATH is the path on the host; the app always
      # sees the DB at /data/birdnet.db inside the container.
      - ${BIRDNET_DB_HOST_PATH}:/data/birdnet.db:ro
      # BirdNET-Go's species taxonomy (read-only), used to show birds only.
      # If missing, the app falls back to hiding BirdNET's non-bird sound
      # classes (Engine, Dog, ...) and lets other non-bird animals through.
      - ${BIRDNET_TAXONOMY_HOST_PATH:-/home/danhon/birdnet-go-app/config/models/shared/taxonomy.csv}:/data/taxonomy.csv:ro
      # Cached species photos (persist across rebuilds)
      - birdhouse-images:/app/data/image-cache

networks:
  traefik_default:
    external: true

volumes:
  birdhouse-images:

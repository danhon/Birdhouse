services:
  app:
    build:
      context: .
      args: [GIT_SHA, BUILD_TIME]   # the commit, for /healthz (make run sets them)
    env_file: .env
    restart: unless-stopped
    # Bounded, so an exception anyone can trigger can't fill the disk. A
    # deployment may swap in its own driver (the author's uses the journal).
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # src/birdhouse/healthcheck.py probes /healthz; a reverse proxy should
    # route only to a healthy container.
    healthcheck:
      test: ["CMD", "python3", "-I", "-S", "/app/src/birdhouse/healthcheck.py"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 60s
      start_interval: 1s
    volumes:
      # BirdNET-Go's SQLite database, read-only; the app sees it at
      # /data/birdnet.db. Required: a missing path would become an empty
      # directory.
      - ${BIRDNET_DB_HOST_PATH:?set BIRDNET_DB_HOST_PATH in .env}:/data/birdnet.db:ro
      # BirdNET-Go's taxonomy.csv, read-only, used to show birds only.
      - ${BIRDNET_TAXONOMY_HOST_PATH:?set BIRDNET_TAXONOMY_HOST_PATH in .env}:/data/taxonomy.csv:ro
      # Cached species photos, kept across rebuilds.
      - birdhouse-images:/app/data/image-cache
      # JSON lines in app.log, for whatever reads your logs.
      - ${BIRDHOUSE_LOG_DIR:-./logs}:/logs

volumes:
  birdhouse-images:

# fleet.yml: what Birdhouse says it is, for fleet-check (reverse-proxy
# docs-site/docs/services/fleet-check.md). The waivers are bootstrapped, for the
# gaps found when the gate started (reverse-proxy#15); the issue named ends them.
service: birdhouse
kind: web
host: birdhouse.sgc.rayandhon.com
internet: false
units: systemd
issue: 7
waivers:
- {check: healthz, until: 2026-12-15, issue: 7, why: liveness endpoint or healthcheck
    missing, bootstrap: true}
- {check: mem-limit, until: 2026-12-15, issue: 7, why: no mem_limit yet, bootstrap: true}
- {check: public-guard, until: 2026-12-15, issue: 7, why: router open without Authelia
    or public-guard, bootstrap: true}
- {check: log-mount, until: 2026-12-15, issue: 7, why: not logging to ~/<app>-logs
    yet, bootstrap: true}
- {check: venv-cache, until: 2026-12-15, issue: 7, why: Dockerfile predates the .venv
    cache rules, bootstrap: true}
- {check: clean-deploy, until: 2026-12-15, issue: 7, why: checkout not clean or not
    at the running commit, bootstrap: true}
- {check: unit-onfailure, until: 2026-12-15, issue: 7, why: units predate decisions/025,
  bootstrap: true}
- {check: unit-memorymax, until: 2026-12-15, issue: 7, why: units predate decisions/025,
  bootstrap: true}
- {check: unit-nice, until: 2026-12-15, issue: 7, why: units predate decisions/025,
  bootstrap: true}
- {check: unit-linked, until: 2026-12-15, issue: 7, why: units installed as copies,
  bootstrap: true}

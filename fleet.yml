# fleet.yml: what Birdhouse says it is, for fleet-check (reverse-proxy
# docs-site/docs/services/fleet-check.md). Its bootstrapped waivers
# (reverse-proxy#15) were closed on 2026-11-22 (#7). The site is
# public, with no sign-in, behind public-guard: `internet: true`, with Dan's
# `fleet-ok: internet` on #7 (2026-11-22). No
# units: systemd/birdhouse.service was the host install's, superseded by compose.
service: birdhouse
kind: web
host: birdhouse.sgc.rayandhon.com
internet: true
issue: 7
audience: users   # Dan, 2026-11-22 (reverse-proxy#144, decisions/047 §4)
waivers:
  - check: users-repo
    until: 2026-12-15
    issue: 9
    why: "The users move (reverse-proxy decisions/047 §5) follows the gunicorn switch in #9, so compose.yml changes once; until then its deployment is still in the repo."

# A release is a tag: v0.1.1 tests, then builds and publishes the image for
# linux/amd64. The image-based install is INSTALL.md's quick start; the
# from-source path (make run) and the reference deployment (make deploy) are
# unchanged.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra dev
      - run: make test

  publish:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # ${{ github.token }} pushes to ghcr.io; no secret is stored. Only this
    # job may write, and only this job needs it.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # v0.1.1 always; `latest` for a release only, never for a pre-release
      # tag such as v0.2.0-rc1 (the action's default flavour).
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/danhon/birdhouse
          tags: |
            type=semver,pattern=v{{version}}

      # The tag is the version: refuse v0.1.1 over a pyproject that says
      # something else, or a tag spelled differently from the one
      # metadata-action will push, before anything is pushed.
      - name: The tag matches project.version and the pushed tag
        env:
          PUSHED_TAG: ${{ steps.meta.outputs.version }}
        run: |
          version=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match project.version $version" >&2
            exit 1
          fi
          if [ "${PUSHED_TAG}" != "${GITHUB_REF_NAME}" ]; then
            echo "tag ${GITHUB_REF_NAME} is not the tag that would be pushed (${PUSHED_TAG})" >&2
            exit 1
          fi

      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # A published version never moves: a re-pushed tag fails here instead
      # of overwriting the image and re-pointing latest at it. Only a "not
      # found" answer lets the build proceed; any other failure (network,
      # auth, rate limit, registry 5xx) fails closed, so the check never
      # passes by accident.
      - name: The version isn't published yet
        run: |
          ref="ghcr.io/danhon/birdhouse:${GITHUB_REF_NAME}"
          if out=$(docker buildx imagetools inspect "$ref" 2>&1); then
            echo "$ref already exists" >&2
            exit 1
          fi
          echo "$out" | grep -qiE 'not found|manifest unknown|name unknown' || { echo "$out" >&2; exit 1; }

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}   # includes revision=${{ github.sha }}
          # One plain linux/amd64 manifest: the default attestation would
          # make the tag an index, so a pull's digest isn't the image's.
          provenance: false
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha,scope=release
          cache-to: type=gha,mode=max,scope=release

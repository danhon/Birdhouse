# For running Birdhouse yourself: `make run`, then http://127.0.0.1:8090.
# docker compose reads this file only when COMPOSE_FILE isn't set; a
# deployment that sets it (with its own proxy and network) never loads it.
services:
  app:
    ports:
      - "127.0.0.1:8090:8090"
    # So BIRDNET_BASE_URL=http://host.docker.internal:8080 reaches a
    # BirdNET-Go on this host on Linux too (Docker Desktop has it built in).
    extra_hosts:
      - "host.docker.internal:host-gateway"

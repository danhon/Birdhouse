[project]
name = "birdhouse"
version = "0.1.0"
description = "Full-bleed bird species carousel from BirdNET-Go detections"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "python-dateutil>=2.9",
    "anthropic>=0.68",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "responses>=0.25",
]

[project.scripts]
birdhouse = "birdhouse.app:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdhouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]

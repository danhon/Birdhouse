[project]
name = "birdhouse"
version = "0.1.0"
description = "Full-bleed bird species carousel from BirdNET-Go detections"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flask>=3.0",
    "requests>=2.31",
    "python-dateutil>=2.9",
    "anthropic>=0.68",
    "gunicorn>=27.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "responses>=0.25",
    "ruff>=0.9",
]

[project.scripts]
birdhouse = "birdhouse.app:main"

[tool.uv]
package = true
# A src layout: without this the second uv sync records a key for src/ that
# changes every build, so the .venv copy is never reused (PY-1).
cache-keys = [{ file = "pyproject.toml" }, { file = "uv.lock" }]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/birdhouse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
